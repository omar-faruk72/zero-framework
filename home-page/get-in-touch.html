<section class="get-in-touch">
    <div class="container touch-container">
        <div class="touch-image">
            <img src="assets/images/get-in.png" alt="Doctor smiling with patient">
        </div>

        <div class="touch-form-wrapper">
            <h2 class="touch-title">Get in Touch</h2>
            <p class="touch-subtitle">Our friendly team would love to hear from you.</p>

            <form class="contact-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Name Here">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="hello@example.com">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+1234567890">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="consent">
                    <label for="consent">
                        I consent to having this website store my submitted information so they can respond to my inquiry. See our <a href="#">privacy policy</a> to learn more about how we use data.
                    </label>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>
</section>
